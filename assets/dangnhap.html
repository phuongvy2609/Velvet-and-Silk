<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐĂNG NHẬP - Velvet & Silk</title>
    <link rel="stylesheet" href="index.html">
    <link rel="stylesheet" href="css/dangnhap.css">
    <link rel="stylesheet" href="css/notice.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main>
        <div class="login">
            <div class="login-title">
                <h1 class="title1">ĐĂNG NHẬP TÀI KHOẢN</h1>
                <p class="content">Đăng nhập để theo dõi đơn hàng và quản lý tài khoản của bạn.</p>
            </div>
            <form class="form-login" id="loginForm" action="/dangnhap" method="POST" autocomplete="off">
                <div class="input-login">
                    <label>Email</label><br>
                    <input type="email"
                        class="input-email"
                        name="email"
                        id="email"
                        autocomplete="off"
                        placeholder="Nhập email" 
                        required>
                </div>

                <div class="input1-login">
                    <label>Mật khẩu</label><br>
                    <input type="password"
                        class="input-pass"
                        name="password"
                        id="password"
                        autocomplete="new-password"
                        placeholder="Mật khẩu" 
                        required>
                    <i class="fa-solid fa-eye togglePassword"></i>
                </div>

                <div class="btn">
                    <p class="account-new"><a href="dangky.html">Tạo tài khoản mới</a></p>
                    <button type="submit" class="btn-login">Đăng nhập</button>
                </div>
            </form>
        </div>
    </main>
    <div class="notice"></div>
    <script src="js/header.js"></script>
    <script src="js/dangnhap.js"></script>
    <script src="js/notice.js"></script>
</body>
</html>
