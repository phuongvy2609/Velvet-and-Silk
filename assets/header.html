    <link rel="stylesheet" href="css/header.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="header">
            <div><a href="index.html" class="logo">Velvet & Silk</a></div>

            <div class="nav">
                <ul class="nav-menu">
                    <li><a href="sanpham.html?category=VÁY">VÁY</a></li>

                    <div class="notification-icon" aria-label="Thông báo">

                <div class="user-box">
                    <i class="u fas fa-user icon-hover"></i>
                    <span id="username"></span>
                </div>
            </div>
            
            <div class="user">

                    <li class="line-item"><div class="linee"></div></li>

    <div class="notice"></div>
