<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TÌM KIẾM VÀ LỌC - Velvet & Silk</title>
    <link rel="stylesheet" href="../css/timkiemvaloc.css">
</head>
<body>
    
    <div class="search-filter">
        <div class="search-filter-input">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Tìm kiếm..."
            >

        </div>

        <div class="search-filter-select">

            <select title="Lọc" id="filterSelect">

                <option value="">
                    -- Lọc --
                </option>

            </select>

        </div>

        <button
            type="button"
            class="search-filter-btn"
            id="searchFilterBtn">

            <i class="fa-solid fa-magnifying-glass"></i>

            Tìm kiếm

        </button>

        <button
            type="button"
            class="search-filter-reset"
            id="searchFilterReset">

            <i class="fa-solid fa-rotate-left"></i>
            Đặt lại
        </button>

    </div>



</body>
</html>
