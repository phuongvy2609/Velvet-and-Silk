<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XEM CHI TIẾT - Velvet & Silk</title>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/xemchitiet.css">
    <link rel="stylesheet" href="css/notice.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="header"></div>

    <main>
        <div class="order">
            <div class="dau">
                <i class="fa-regular fa-circle-check"></i>
                <h1>Đặt Hàng Thành Công !</h1>
                <p>Cảm ơn bạn đã tin tưởng và ủng hộ Velvet & Silk.</p>
            </div>

            <div class="content-card">
                <div class="order-id">Mã Đơn: </div>
                
                <div class="info">
                    <div class="info-item">
                        <i class="fas fa-user"></i>
                        <span class="label">Người nhận:</span> 
                        <span class="receiver"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <span class="label">Email:</span> 
                        <span class="email"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-phone"></i>
                        <span class="label">Số điện thoại:</span> 
                        <span class="phone"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span class="label">Địa chỉ nhận:</span> 
                        <span class="address"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-credit-card"></i>
                        <span class="label">Phương thức thanh toán:</span> 
                        <span class="payment-method"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-truck"></i>
                        <span class="label">Phương thức giao hàng:</span> 
                        <span class="shipping-method-info"></span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <span class="label">Thời gian:</span> 
                        <span class="order-time"></span>
                    </div>
                </div>
            </div>

            <hr class="divider">

            <div class="product-item">
                <!-- <div class="product-info">
                    <img src="images/aocupnguctrang.jpg" alt="ảnh">
                    <div>
                        <div class="product-name">Áo Cúp Ngực Trắng</div>
                        <div class="product-qty">Số lượng: 1</div>
                    </div>
                </div>
                <div class="product-price">470.000đ</div> -->
            </div>

            <hr class="divider-dashed">

            <div class="voucher-row">
                <span>Voucher:</span>
                <span class="voucher-code"></span>
            </div>

            <div class="discount-row">
                <span>Giảm giá:</span>
                <span class="voucher-discount"></span>
            </div>

            <div class="summary">
                <div class="total">
                    <span>Tổng tiền:</span> 
                    <span class="total-money"> </span>
                </div>
            </div>
            <div class="nut-btn">
                <a href="index.html"><button class="btn btn-home"><i class="fas fa-home"></i> Về trang chủ</button></a>
                <a href="lichsudathang.html"><button class="btn btn-view"><i class="fas fa-shopping-bag"></i> Xem đơn hàng</button></a>
            </div>
        </div>
    </main>
<div class="notice"></div>
<div id="footer"></div>

<script src="js/header.js"></script>
<script src="js/xemchitiet.js"></script>
<script src="js/notice.js"></script>
<script src="js/notificationUser.js"></script>
</body>
</html>
