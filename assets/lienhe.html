<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIÊN HỆ - Velvet & Silk</title>
    <link rel="stylesheet" href="css/lienhe.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/notice.css">
    <link rel="stylesheet" href="css/khungchung.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div id="header"></div>

    <div class="contact-container">
        <div class="contact-info">
            <h2>LIÊN HỆ CHÚNG TÔI</h2>
            
            <div class="info-item">
                <i class="fa-solid fa-house"></i>
               <strong>ĐỊA CHỈ: </strong><span>Số nhà 258, tổ 9, ấp Hưng Thới, xã Thạnh Mỹ Tây, tỉnh An Giang.</span>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <strong>SỐ ĐIỆN THOẠI: </strong><span>0383577505</span>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <strong>EMAIL: </strong><span>nguyenngocphuongvy073@gmail.com</span>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-map-location-dot"></i>
                <strong>GIỜ LÀM VIỆC: </strong><span>8:00 AM - 22:00 PM, Monday - Sunday</span>
            </div>

            <div class="social-icons">
                <a href="https://www.facebook.com/share/1EfA2zXJs6/" aria-label="Facebook" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="mailto:nguyenngocphuongvy073@gmail.com"><i class="e fa-solid fa-envelope"></i></a>
                <a href="https://x.com/" aria-label="Twitter" title="Twitter"><i class="t fa-brands fa-twitter"></i></a>
                <a href="https://www.google.com/?hl=vi&zx=1789544634192" aria-label="Google" title="Google"><i class="fa-brands fa-google"></i></a>
            </div>

            <div class="map-container">
                <h2>VỊ TRÍ CỦA CHÚNG TÔI</h2>
                <iframe
                    src="https://www.google.com/maps?q=S%E1%BB%91%20nh%C3%A0%20258%2C%20t%E1%BB%95%209%2C%20%E1%BA%A5p%20H%C6%B0ng%20Th%E1%BB%9Bi%2C%20x%C3%A3%20Th%E1%BA%A1nh%20M%E1%BB%B9%20T%C3%A2y%2C%20An%20Giang&output=embed"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>

        <form class="contact-form" action="#" method="POST">
            <div class="form-row">
                <div class="form-group-inline">
                    <label>Tên Của Bạn</label>
                    <input
                        type="text"
                        class="name"
                        placeholder="Tên của tài khoản"
                        readonly
                    >
                </div>
                <div class="form-group-inline">
                    <label>Email</label>
                    <input 
                        type="email" 
                        class="email" 
                        placeholder="Email của tài khoản"
                        readonly
                    >
                </div>
            </div>

            <div class="form-group-block">
                <label>Lời Nhắn</label>
                <textarea class="mess" placeholder="Viết Lời Nhắn..."></textarea>
            </div>

            <div class="submit-btn-container">
                <button type="submit" class="submit-btn">Gửi Lời Nhắn</button>
            </div>

        </form>
    </div>


    <div class="notice"></div>
    <div id="footer"></div>

    <script src="js/header.js"></script>
    <script src="js/lienhe.js"></script>
    <script src="js/notice.js"></script>
    <script src="js/notificationUser.js"></script>
</body>
</html>
