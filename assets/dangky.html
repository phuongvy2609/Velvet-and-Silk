<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐĂNG KÝ - Velvet & Silk</title>
    <link rel="stylesheet" href="index.html">
    <link rel="stylesheet" href="css/dangky.css">
    <link rel="stylesheet" href="css/notice.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main>
        <div class="register">
            <h1 class="title">ĐĂNG KÝ TÀI KHOẢN</h1>
            <p class="title1">Tạo tài khoản Velvet & Silk để mua sắm nhanh và lưu lịch sử đơn hàng.</p>
            <form class="form" action="/dangky" method="POST" autocomplete="off">
                <div class="row1">
                    <div class="name-phone">
                        <label>Họ và tên</label><br>
                        <input type="text" class="fullname" name="fullname" placeholder="Nhập họ và tên" autocomplete="off" required>
                    </div>

                    <div class="name-phone">
                        <label>Số điện thoại</label><br>
                        <input type="text" class="phone" name="phone" placeholder="Nhập số điện thoại" autocomplete="off" required>
                    </div>
                </div>

                <div>
                    <label>Email</label><br>
                    <input type="email" class="input-email" name="email" placeholder="Nhập email" autocomplete="off" required>
                </div>

                <div class="row2">
                    <div class="password">
                        <label>Nhập mật khẩu</label><br>
                        <div class="input-group">  
                            <input 
                                type="password" 
                                class="pw" 
                                name="password" 
                                placeholder="Nhập mật khẩu" 
                                autocomplete="new-password" 
                                required>
                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>
                </div>

                <div class="btn">
                    <p class="btn-have">
                        <a href="dangnhap.html">Đã có tài khoản</a>
                    </p>              
                    <button type="submit" class="btn-register">Đăng ký</button>
                </div>
            </form>
        </div>
    </main>
    <div class="notice"></div>
    <script src="js/header.js"></script>
    <script src="js/dangky.js"></script>
    <script src="js/notice.js"></script>
</body>
</html>
